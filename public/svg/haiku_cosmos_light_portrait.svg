<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1000" role="img" aria-label="Haiku Cosmos light portrait panel background">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fdff"/>
      <stop offset="0.42" stop-color="#eafaff"/>
      <stop offset="1" stop-color="#dff7ff"/>
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="43%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#ecfbff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#9eefff" stop-opacity="0.42"/>
    </radialGradient>
    <radialGradient id="cornerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#65e5ff" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#2aa7d5" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="lineGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="stars" width="92" height="92" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="20" r="1.25" fill="#1f98c8" opacity="0.34"/>
      <circle cx="71" cy="16" r="0.9" fill="#00b7dd" opacity="0.22"/>
      <circle cx="52" cy="62" r="1.1" fill="#137eaf" opacity="0.26"/>
      <path d="M26 68h8M30 64v8" stroke="#3acde7" stroke-width="0.9" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="700" height="1000" rx="38" fill="url(#paper)"/>
  <rect width="700" height="1000" rx="38" fill="url(#aura)"/>
  <rect width="700" height="1000" rx="38" fill="url(#stars)" opacity="0.75"/>

  <g opacity="0.42" filter="url(#soft)">
    <circle cx="84" cy="102" r="122" fill="url(#cornerGlow)"/>
    <circle cx="616" cy="112" r="116" fill="url(#cornerGlow)"/>
    <circle cx="92" cy="892" r="130" fill="url(#cornerGlow)"/>
    <circle cx="612" cy="882" r="128" fill="url(#cornerGlow)"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)">
    <rect x="30" y="30" width="640" height="940" rx="34" stroke="#65dcf4" stroke-width="2.2" opacity="0.46"/>
    <rect x="54" y="58" width="592" height="884" rx="28" stroke="#0e85b7" stroke-width="1.2" opacity="0.2"/>

    <path d="M94 112c74-47 138-46 198 1M408 111c64-45 130-45 198 1" stroke="#31cce8" stroke-width="1.6" opacity="0.42"/>
    <path d="M96 888c72 46 136 46 194 0M410 888c62 44 128 44 194 0" stroke="#31cce8" stroke-width="1.6" opacity="0.4"/>

    <path d="M78 210c54 38 92 79 112 123M622 210c-54 38-92 79-112 123" stroke="#12a7d1" stroke-width="1.15" opacity="0.22"/>
    <path d="M78 790c54-38 92-79 112-123M622 790c-54-38-92-79-112-123" stroke="#12a7d1" stroke-width="1.15" opacity="0.22"/>

    <circle cx="350" cy="148" r="28" stroke="#17c4df" stroke-width="1.4" opacity="0.3"/>
    <circle cx="350" cy="852" r="28" stroke="#17c4df" stroke-width="1.4" opacity="0.3"/>
    <path d="M328 148h44M350 126v44M328 852h44M350 830v44" stroke="#0f91bf" stroke-width="0.9" opacity="0.28"/>
  </g>

  <g opacity="0.22" fill="none" stroke="#087dae" stroke-width="1">
    <path d="M145 506c68-42 128-42 184 0s116 42 184 0"/>
    <path d="M164 548c58-31 113-31 166 0s106 31 164 0" opacity="0.72"/>
    <path d="M178 466c52-28 104-28 156 0s104 28 156 0" opacity="0.62"/>
  </g>
</svg>
